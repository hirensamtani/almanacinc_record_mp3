name: almanacinc_record_mp3_example
description: >-
  Example application demonstrating the almanacinc_record_mp3 Flutter plugin.
  Shows start/pause/resume/stop recording lifecycle and status stream.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  almanacinc_record_mp3:
    path: ../
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
